# Alerts module settings (Person 4). The delay limit lives in thresholds.conf.
# dry-run = print only | log-only = write logs/alerts.log | send = mailx + log
ALERT_MODE="dry-run"
# Recipients for send mode (space or comma separated). Do not commit real addresses.
MAIL_TO=""
# Max alerts shown in one message; the log always has the full list (0 = all)
MAX_ALERTS_IN_MESSAGE=10
MAIL_SUBJECT_PREFIX="[Transit Alert]"
