# Delay classification thresholds (minutes). Read by scripts/process_delays.sh.
# delay_min <= ON_TIME_MAX_MIN                          -> ON_TIME  (includes all early arrivals)
# ON_TIME_MAX_MIN < delay_min < MAJOR_DELAY_MIN         -> DELAYED
# delay_min >= MAJOR_DELAY_MIN                          -> MAJOR_DELAY
# Both values must be non-negative numbers and ON_TIME_MAX_MIN < MAJOR_DELAY_MIN.
ON_TIME_MAX_MIN=5
MAJOR_DELAY_MIN=15
